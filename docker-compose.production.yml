version: '3.8'

services:
  postgres:
    image: postgres:13
    container_name: postgres
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend          # ← СВОЙ Dockerfile (PostgreSQL)
    container_name: backend
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - static:/app/collected_static
      - media:/app/media
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn --bind 0.0.0.0:8000 kittygram_backend.wsgi
      "

  frontend:
    image: leeevs/kittygram_frontend  # ← Оставляем готовый React
    container_name: frontend
    command: >
      sh -c "
        set -e
        cp /app/build/index.html /static/index.html
        cp -r /app/build/static/. /static/
        if [ -f /app/build/asset-manifest.json ]; then cp /app/build/asset-manifest.json /static/; fi
        if [ -f /app/build/favicon.ico ]; then cp /app/build/favicon.ico /static/; fi
        if [ -f /app/build/manifest.json ]; then cp /app/build/manifest.json /static/; fi
        if [ -f /app/build/robots.txt ]; then cp /app/build/robots.txt /static/; fi
      "
    volumes:
      - static:/static

  gateway:
    build: ./nginx            # ← СВОЙ nginx с вашим default.conf
    container_name: gateway
    depends_on:
      - backend
      - frontend
    ports:
      - "9000:80"
    volumes:
      - static:/static
      - media:/media

volumes:
  pg_data:
  static:
  media:
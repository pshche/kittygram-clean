name: Kittygram CI/CD

on:
  push:
    branches:
      - main

concurrency:
  group: kittygram-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    
    # ✅ Добавлена PostgreSQL для тестов
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: kittygram
          POSTGRES_USER: kittygram_user
          POSTGRES_PASSWORD: kittygram_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-django
          pip install -r backend/requirements.txt

      - name: Flake8 backend
        run: flake8 backend/

      - name: Django tests
        env:
          SECRET_KEY: test-secret-key
          DEBUG: "False"
          POSTGRES_DB: kittygram
          POSTGRES_USER: kittygram_user
          POSTGRES_PASSWORD: kittygram_password
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          cd backend
          python manage.py test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: CI=true npm test -- --watchAll=false --passWithNoTests

  build_and_push:
    name: Push Docker images to Docker Hub
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kittygram_backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kittygram_frontend:latest

      - name: Build and push gateway
        uses: docker/build-push-action@v7
        with:
          context: ./nginx
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kittygram_gateway:latest

  deploy:
    name: Deploy to production
    needs: build_and_push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -o IdentitiesOnly=yes -i ~/.ssh/deploy_key ${{ secrets.USER }}@${{ secrets.HOST }} << EOF
            set -e
            
            # Создать директорию
            mkdir -p ~/kittygram
            
            cd ~/kittygram
            
            # ✅ Безопасное создание .env на сервере
            cat > .env << 'ENVEOF'
            ${{ secrets.PROD_ENV_FILE }}
ENVEOF
            chmod 600 .env
            
            # ✅ Копировать только compose файл
            scp -o IdentitiesOnly=yes -i ~/.ssh/deploy_key ${{ github.workspace }}/docker-compose.production.yml . 
            
            # ✅ Надежный деплой
            sudo docker compose down || true
            sudo docker compose pull
            sudo docker compose up -d --remove-orphans
            
            # ✅ Миграции и статика
            sudo docker compose exec -T backend python manage.py migrate --noinput
            sudo docker compose exec -T backend python manage.py collectstatic --noinput
            
            # ✅ Smoke тесты (замена auto_tests)
            sleep 30
            curl -f http://localhost/health/ || curl -f http://localhost/api/health/ || exit 1
            
            echo "✅ Deploy completed successfully!"
          EOF

  notify:
    name: Notify
    # ✅ Запускается всегда (success/failure)
    if: always()
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="${{ needs.deploy.result }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"Kittygram deploy: ${{ needs.deploy.result }}\"}"
